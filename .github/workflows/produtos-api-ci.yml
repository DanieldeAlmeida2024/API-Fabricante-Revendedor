name: API Fabricante-Revendedor - Contratos ProdutosAPI Dell Fujioka

on:
  pull_request:
  push:
    branches: [main, fix/produtosapi-crud-sqlite-errors-20261112, fix/fujioka-upstream-errors-and-jsp-safety-20261112]

permissions:
  contents: read

jobs:
  produtos-api-java:
    name: Java 17 - ProdutosAPI, Dell e Fujioka
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            ProdutosAPI/pom.xml
            Dell/pom.xml
            fujioka/pom.xml
      - name: Validar e empacotar WAR ProdutosAPI sem usar banco real
        run: mvn -B -ntp -f ProdutosAPI/pom.xml clean verify
      - name: Validar contrato do consumidor Dell com HTTP local
        run: mvn -B -ntp -f Dell/pom.xml clean verify
      - name: Validar consumidor Fujioka com HTTP loopback
        run: mvn -B -ntp -f fujioka/pom.xml clean verify
      - name: Prevenir arquivos de configuração locais versionados
        run: |
          if test -n "$(git ls-files -- Dell/.env fujioka/.env)"; then
            echo "ERRO: arquivos .env locais rastreados no Git"
            exit 1
          fi
      - name: Validar documentação versionada
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
